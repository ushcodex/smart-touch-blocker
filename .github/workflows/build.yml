name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x apk/gradlew

      - name: Build debug APK
        run: cd apk && ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        run: cd apk && ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchBlocker-debug
          path: apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchBlocker-release-unsigned
          path: apk/app/build/outputs/apk/release/app-release-unsigned.apk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x apk/gradlew

      - name: Build debug APK
        run: cd apk && ./gradlew assembleDebug --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Touch Blocker ${{ github.ref_name }}"
          body: |
            ## Smart Touch Blocker ${{ github.ref_name }}

            ### Install
            1. Download `TouchBlocker-debug.apk` below
            2. Enable *Install from unknown sources* on your phone
            3. Install the APK
            4. Open the app → grant Overlay permission → tap **Turn ON**

            ### What it does
            - **Blocks ghost touches** from a malfunctioning touchscreen digitizer at the kernel overlay level
            - **Mouse clicks pass through** unaffected (via dynamic `FLAG_NOT_TOUCHABLE` toggle)
            - Runs as a persistent foreground service with a notification + floating ✕ button to stop
          files: apk/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
